LoginGraceTime 30
MaxAuthTries 3
MaxSessions 3
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
PermitUserEnvironment no
DebianBanner no

# Password/root access stays enabled until a replacement key is verified.
PermitRootLogin yes
PasswordAuthentication yes
PubkeyAuthentication yes
